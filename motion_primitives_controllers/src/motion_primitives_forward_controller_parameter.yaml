motion_primitives_forward_controller:
  tf_prefix: {
    type: string,
    default_value: "",
    description: "All interfaces use the naming scheme `tf_prefix_ + motion_primitive/<interface name>`",
    read_only: true,
  }
  hardware_solves_kinematics: {
    type: bool,
    default_value: false,
    description: "Whether or not the hardware interface that is used with this controller can do both forward and inverse kinematics. Enables sending poses for LINEAR_JOINT commands and joint angles for LINEAR_CARTESIAN commands.",
    read_only: false,
  }
