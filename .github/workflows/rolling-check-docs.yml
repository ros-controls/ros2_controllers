name: Rolling Check Docs

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - '*feature*'
      - '*feature/**'
    paths:
      - '**.rst'
      - '**.md'
      - '**.jpg'
      - '**.jpeg'
      - '**.png'
      - '**.svg'
      - '**.yml'
      - '**.yaml'
      - '!.github/**' # exclude yaml files in .github directory
      - '.github/workflows/rolling-check-docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-docs:
    name: Check Docs
    uses: kamal2730/control.ros.org/.github/workflows/reusable-sphinx-check-single-version.yml@989b05d94b741da78e4f75f9a04931fdd6e4f4a6
    with:
      ROS2_CONTROLLERS_PR: ${{ github.ref }}
