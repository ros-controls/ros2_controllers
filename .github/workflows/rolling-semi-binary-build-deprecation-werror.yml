name: Rolling Semi-Binary Build Deprecation Werror
# description: 'Build with deprecation warnings treated as errors.'

on:
  workflow_dispatch:
  pull_request: &event
    branches:
      - master
      - '*feature*'
      - '*feature/**'
    paths:
      - '**.hpp'
      - '**.h'
      - '**.cpp'
      - '**.py'
      - '**.yaml'
      - '.github/workflows/rolling-semi-binary-build-deprecation-werror.yml'
      - '**/package.xml'
      - '**/CMakeLists.txt'
      - 'ros2_controllers-not-released.rolling.repos'
      - 'ros2_controllers-not-released.lyrical.repos'
      - '**.xml'
  push: *event
  schedule:
    # Run every morning to detect flakiness and broken dependencies
    - cron: '13 1 * * MON-FRI'

concurrency:
  # cancel previous runs of the same workflow, except for pushes on given branches
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads') }}

jobs:
  semi_binary_deprecation_warnings_as_errors:
    uses: ros-controls/ros2_control_ci/.github/workflows/reusable-industrial-ci-with-cache.yml@master
    strategy:
      fail-fast: false
      matrix:
        ROS_DISTRO: [lyrical, rolling]
    with:
      ros_distro: ${{ matrix.ROS_DISTRO }}
      ros_repo: testing
      upstream_workspace: ros2_controllers-not-released.${{ matrix.ROS_DISTRO }}.repos
      ref_for_scheduled_build: master
      additional_debs: clang
      c_compiler: clang
      cxx_compiler: clang++
      not_test_build: true
